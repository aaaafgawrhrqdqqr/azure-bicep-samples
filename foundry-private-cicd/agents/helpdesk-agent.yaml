# =============================================================================
# エージェント定義（プロンプト エージェント）
# このファイルを変更して main に push すると、agents ワークフローが
# Foundry に新しいバージョンとして反映する。
# 1 ファイル = 1 エージェント。ファイルを増やせばエージェントも増える。
# =============================================================================

# エージェント名（英数字とハイフン。Foundry 上の識別子になる）
name: helpdesk-agent

# 使うモデルの「デプロイ名」（infra/main.bicep の modelName と合わせる）
model: gpt-5-mini

# システム プロンプト
instructions: |
  あなたは社内ヘルプデスクの一次回答を担当するアシスタントです。
  - 日本語で、簡潔に回答してください。
  - 分からないことは推測せず、「担当部署に確認してください」と案内してください。
  - パスワードや個人情報を聞き出してはいけません。

# デプロイ後の動作確認（smoke_test.py が使う）
smoke_test:
  input: "パスワードを忘れたときはどうすればいいですか？"
  # 応答に含まれているべき語句（空なら「何か返ってくれば OK」）
  expect_any: []
